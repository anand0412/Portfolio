<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Project</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="style.css">

</head>

<body>

<a href="index.html#portfolio" class="floating-back-btn">
    <i class="fas fa-arrow-left"></i>
    Back
</a>

<section class="project-hero">

    <h1 id="project-title"></h1>

    <div class="project-details">

        <div>
            <strong>Client</strong>
            <span id="project-client"></span>
        </div>

        <div>
            <strong>Year</strong>
            <span id="project-year"></span>
        </div>

        <div>
            <strong>Category</strong>
            <span id="project-category"></span>
        </div>

    </div>

<div class="case-study">

    <div class="case-card">
        <h3>Industry</h3>
        <p id="project-industry"></p>
    </div>

    <div class="case-card">
        <h3>Role</h3>
        <p id="project-role"></p>
    </div>

    <div class="case-card">
        <h3>Objective</h3>
        <p id="project-objective"></p>
    </div>

    <div class="case-card">
        <h3>Challenge</h3>
        <p id="project-challenge"></p>
    </div>

    <div class="case-card">
        <h3>Solution</h3>
        <p id="project-solution"></p>
    </div>

    <div class="case-card">
        <h3>Deliverables</h3>
        <p id="project-deliverables"></p>
    </div>

    <div class="case-card">
        <h3>Tools Used</h3>
        <p id="project-tools"></p>
    </div>

</div>

</section>

<section class="project-gallery"
id="project-gallery">

</section>

<div class="lightbox">

    <span class="close-lightbox">
        &times;
    </span>

    <button class="lightbox-prev">
        &#10094;
    </button>

    <img class="lightbox-image">

    <button class="lightbox-next">
        &#10095;
    </button>

</div>

<footer>

    <div class="footer-name">
        Anand Srivastava
    </div>

    <div class="footer-title">
        Creative Graphic Designer
    </div>

    <div class="footer-copy">
        © 2026 Anand Srivastava. All Rights Reserved.
    </div>

</footer>

<script>

const params = new URLSearchParams(window.location.search);
const projectId = params.get("id");

fetch("data/projects.json")
.then(response => response.json())
.then(projects => {

    const project =
    projects.find(p => p.id === projectId);

    if(!project){

        document.body.innerHTML =
        "<h1>Project Not Found</h1>";

        return;
    }

    document.title =
    project.title;

    document.getElementById("project-title").textContent =
    project.title;

    document.getElementById("project-client").textContent =
    project.client;

    document.getElementById("project-year").textContent =
    project.year;

    document.getElementById("project-category").textContent =
    project.categories.join(", ");

    document.getElementById("project-industry").textContent =
project.industry;

document.getElementById("project-role").textContent =
project.role;

document.getElementById("project-objective").textContent =
project.objective;

document.getElementById("project-challenge").textContent =
project.challenge;

document.getElementById("project-solution").textContent =
project.solution;

document.getElementById("project-deliverables").textContent =
project.deliverables;

document.getElementById("project-tools").textContent =
project.tools;

    const gallery =
    document.getElementById("project-gallery");

    let currentIndex = 0;

const lightbox =
document.querySelector(".lightbox");

const lightboxImage =
document.querySelector(".lightbox-image");

project.images.forEach((image,index) => {

    const img =
    document.createElement("img");

    img.src = image;

    img.addEventListener("click",()=>{

        currentIndex = index;

        lightboxImage.src =
        project.images[currentIndex];

        lightbox.classList.add("active");

    });

    gallery.appendChild(img);

});

document.querySelector(".close-lightbox")
.addEventListener("click",()=>{

    lightbox.classList.remove("active");

});

document.querySelector(".lightbox-prev")
.addEventListener("click",()=>{

    currentIndex--;

    if(currentIndex < 0){

        currentIndex =
        project.images.length - 1;
    }

    lightboxImage.src =
    project.images[currentIndex];

});

document.querySelector(".lightbox-next")
.addEventListener("click",()=>{

    currentIndex++;

    if(currentIndex >= project.images.length){

        currentIndex = 0;
    }

    lightboxImage.src =
    project.images[currentIndex];

});

lightbox.addEventListener("click",(e)=>{

    if(e.target === lightbox){

        lightbox.classList.remove("active");

    }

});

});

</script>

</body>
</html>
