<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Project</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="style.css">

</head>

<body>

<a href="index.html#portfolio" class="floating-back-btn">
    <i class="fas fa-arrow-left"></i>
    Back
</a>

<section class="project-hero">

    <h1 id="project-title"></h1>

    <div class="project-details">

        <div>
            <strong>Client</strong>
            <span id="project-client"></span>
        </div>

        <div>
            <strong>Year</strong>
            <span id="project-year"></span>
        </div>

        <div>
            <strong>Category</strong>
            <span id="project-category"></span>
        </div>

    </div>

</section>

<section class="project-gallery" id="project-gallery">

</section>

<footer>

    <div class="footer-name">
        Anand Srivastava
    </div>

    <div class="footer-title">
        Creative Graphic Designer
    </div>

    <div class="footer-copy">
        © 2026 Anand Srivastava. All Rights Reserved.
    </div>

</footer>

<script>

const params = new URLSearchParams(window.location.search);
const projectId = params.get("id");

fetch("data/projects.json")
.then(response => response.json())
.then(projects => {

    const project =
    projects.find(p => p.id === projectId);

    if(!project){

        document.body.innerHTML =
        "<h1>Project Not Found</h1>";

        return;
    }

    document.title =
    project.title;

    document.getElementById("project-title").textContent =
    project.title;

    document.getElementById("project-client").textContent =
    project.client;

    document.getElementById("project-year").textContent =
    project.year;

    document.getElementById("project-category").textContent =
    project.categories.join(", ");

    const gallery =
    document.getElementById("project-gallery");

    project.images.forEach(image => {

        const img =
        document.createElement("img");

        img.src = image;

        gallery.appendChild(img);

    });

});

</script>

</body>
</html>
